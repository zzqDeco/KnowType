name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  test:
    name: Swift build and test
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Show Swift version
        run: swift --version
      - name: Prepare Rime artifacts
        run: ./scripts/prepare-rime-artifacts.sh
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Input method install/profile script smoke
        run: ./scripts/smoke-inputmethod-install.sh
